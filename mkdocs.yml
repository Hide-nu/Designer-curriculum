site_name: デザイナー・カリキュラム 2026
site_description: 世界トップデザインスクールに学ぶ次世代デザイン教育カリキュラム
site_author: Design Curriculum Project
repo_url: https://github.com/hide-nu/designer-curriculum

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: ダークモードに切替
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: ライトモードに切替
  features:
    - content.code.copy
    - navigation.expand
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - toc.follow
  font:
    text: Noto Sans JP
    code: Roboto Mono
  language: ja

plugins:
  - search:
      lang: ja

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - ホーム: index.md
  - カリキュラム概要: curriculum-overview.md
  - Book 1 - デザイン思考の基礎:
    - 概要: books/01-design-thinking/index.md
